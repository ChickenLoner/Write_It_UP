name: Cloudflare Pages Preview

# Builds every same-repo pull request and uploads it as a Cloudflare Pages
# PREVIEW deployment, so a change can be checked on a real URL before it is
# merged. cloudflare-deploy.yml remains the only thing that touches production.
#
# The preview is served from  https://<branch>.write-it-up.pages.dev  (the
# exact URL is in the job summary). Custom domains serve production only, so
# writeups.chicken0248.fyi is never affected.
#
# Safety:
#   * Forks are skipped — they must not run with the Cloudflare secrets.
#   * The branch name reaches the shell through an env var, never inline.
#   * The deploy step refuses to run when the branch resolves to the
#     production branch (main), which would overwrite the live site.
#   * Preview deployments get Cloudflare's default noindex header.
#
# Requires the same secrets as cloudflare-deploy.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One preview build per PR; a newer push supersedes an older one in flight.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CF_PROJECT: write-it-up

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install markdown2 pillow

      - name: Restore image encode cache
        uses: actions/cache@v4
        with:
          path: .imgcache
          key: imgcache-${{ github.sha }}
          restore-keys: |
            imgcache-

      - name: Convert Markdown to HTML
        run: python build_md_to_html_with_toc.py

      - name: Sanity-check the built site
        run: |
          test -s build/index.html || { echo "::error::build/index.html missing or empty"; exit 1; }
          test -s build/404.html   || { echo "::error::build/404.html missing or empty"; exit 1; }
          pages=$(find build -name '*.html' | wc -l)
          echo "built $pages HTML pages"
          [ "$pages" -ge 100 ] || { echo "::error::only $pages HTML pages"; exit 1; }
          grep -q 'class="wrow"' build/index.html || {
            echo "::error::index.html contains no write-up cards"; exit 1; }

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty or unset"
            exit 1
          fi
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "::error::refusing to deploy a preview from branch '$BRANCH' — that targets production"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy build \
            --project-name="$CF_PROJECT" \
            --branch="$BRANCH" 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          {
            echo "### Preview deployed"
            echo ""
            echo "${url:-see the log above}"
          } >> "$GITHUB_STEP_SUMMARY"
